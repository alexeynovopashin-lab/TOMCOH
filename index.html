<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Томсон — Бронирование</title>
<meta name="theme-color" content="#eef1f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Томсон">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --bg:#eef1f5;
  --card:#ffffff;
  --card-2:#f6f8fa;
  --text:#1c1c1e;
  --text2:#636366;
  --text3:#8e8e93;
  --line: rgba(0,0,0,.05);
  --accent:#007aff;
  --accent-soft: rgba(0,122,255,.12);
  --danger:#ff3b30;
  --danger-soft: rgba(255,59,48,.10);
  --ok:#34c759;
  --shadow-out: 8px 8px 18px rgba(163,177,198,.42), -6px -6px 14px rgba(255,255,255,.9);
  --shadow-out-sm: 5px 5px 11px rgba(163,177,198,.4), -4px -4px 9px rgba(255,255,255,.95);
  --shadow-in: inset 4px 4px 9px rgba(163,177,198,.35), inset -4px -4px 9px rgba(255,255,255,.85);
  --radius:20px;
  --radius-sm:13px;
  --radius-lg:26px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,textarea,select{font:inherit; color:inherit;}
button{border:0; background:none; cursor:pointer;}
input,textarea,select{border:0; outline:0; background:none;}
svg{display:block;}
.icon{width:20px; height:20px; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round;}

.app{max-width:520px; margin:0 auto; min-height:100dvh; padding-bottom:calc(78px + var(--safe-b)); position:relative;}

.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(238,241,245,.82);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  padding:16px 20px 12px; border-bottom:1px solid var(--line);
}
.topbar h1{font-size:1.4rem; font-weight:800; letter-spacing:-.02em;}
.topbar .sub{font-size:.76rem; color:var(--text3); font-weight:600; margin-top:1px; letter-spacing:.01em;}

.content{padding:14px 16px 24px;}
.view{display:none;}
.view.active{display:block;}

.card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow-out);
  padding:18px; margin-bottom:14px;
}
.card-title{
  font-size:.72rem; font-weight:700; color:var(--text3); text-transform:uppercase;
  letter-spacing:.08em; margin-bottom:13px;
}
.card-title.row{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}

/* chips (halls) */
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px; scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:1 0 auto; min-width:84px; background:var(--card); border-radius:var(--radius-sm);
  box-shadow:var(--shadow-out-sm); padding:12px 10px; text-align:center; color:var(--text2);
}
.chip .cn{font-weight:700; font-size:.92rem; display:block;}
.chip .co{font-size:.68rem; color:var(--text3); margin-top:2px; display:block;}
.chip.active{box-shadow:var(--shadow-in);}
.chip .dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle;}

/* fields */
label{display:block; font-size:.74rem; font-weight:600; color:var(--text3); margin:13px 0 5px;}
label:first-of-type{margin-top:0;}
.field{
  width:100%; background:var(--bg); border-radius:12px; padding:12px 13px;
  font-size:1rem; box-shadow:var(--shadow-in);
}
.field:focus{box-shadow: inset 3px 3px 8px rgba(0,122,255,.16), inset -3px -3px 7px rgba(255,255,255,.9);}
textarea.field{min-height:96px; resize:vertical; line-height:1.5;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.seg{display:flex; background:var(--bg); border-radius:12px; padding:3px; box-shadow:var(--shadow-in); gap:2px;}
.seg button{flex:1; padding:9px 4px; border-radius:9px; font-size:.83rem; font-weight:700; color:var(--text3); text-align:center;}
.seg button.active{background:var(--card); color:var(--accent); box-shadow:var(--shadow-out-sm);}

.status-row{display:flex; gap:8px;}
.status-btn{flex:1; padding:11px 4px; border-radius:12px; background:var(--bg); box-shadow:var(--shadow-out-sm); font-size:.82rem; font-weight:700; color:var(--text2); text-align:center;}
.status-btn.active{box-shadow:var(--shadow-in); color:var(--accent); background:var(--accent-soft);}

.tags{display:flex; flex-wrap:wrap; gap:7px;}
.tag{width:42px; height:42px; border-radius:12px; background:var(--bg); box-shadow:var(--shadow-out-sm); font-size:1.15rem; display:flex; align-items:center; justify-content:center;}
.tag.active{box-shadow:var(--shadow-in); background:var(--accent-soft);}

.price-hint{font-size:.75rem; color:var(--text3); margin-top:13px; padding:11px 12px; background:var(--bg); border-radius:11px; box-shadow:var(--shadow-in); line-height:1.5; white-space:pre-line;}

.conflict{display:none; align-items:flex-start; gap:10px; background:var(--danger-soft); border-radius:var(--radius-sm); padding:12px 13px; margin-bottom:14px; font-size:.8rem; line-height:1.45; color:#a4160f;}
.conflict.show{display:flex;}
.conflict .icon{stroke:var(--danger); flex:0 0 auto; margin-top:1px;}
.conflict b{color:#7a0e09;}

.preview{
  background:var(--bg); border-radius:14px; padding:14px; font-size:.83rem; line-height:1.55;
  white-space:pre-wrap; word-break:break-word; max-height:230px; overflow-y:auto; box-shadow:var(--shadow-in); color:var(--text2);
}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px; border-radius:14px; font-size:.94rem; font-weight:700; cursor:pointer; color:#fff; margin-top:10px;}
.btn:active{transform:scale(.97);}
.btn .icon{stroke:#fff; width:18px; height:18px;}
.btn-wa{background:linear-gradient(150deg,#2ee06a,#25d366); box-shadow:4px 5px 14px rgba(37,211,102,.35);}
.btn-tg{background:linear-gradient(150deg,#4fb6ea,#0088cc); box-shadow:4px 5px 14px rgba(0,136,204,.32);}
.btn-max{background:linear-gradient(150deg,#8f80f8,#6c5ce7); box-shadow:4px 5px 14px rgba(108,92,231,.32);}
.btn-blue{background:linear-gradient(150deg,#5ac8fa,#007aff); box-shadow:4px 5px 14px rgba(0,122,255,.3);}
.btn-dark{background:linear-gradient(150deg,#3a3a3c,#1c1c1e); box-shadow:4px 5px 14px rgba(0,0,0,.25);}
.btn-danger{background:linear-gradient(150deg,#ff6b60,#ff3b30); box-shadow:4px 5px 14px rgba(255,59,48,.3);}
.btn-ghost{background:var(--card); color:var(--text); box-shadow:var(--shadow-out-sm);}
.btn-ghost .icon{stroke:var(--text);}
.btn-sm{padding:10px; font-size:.82rem; margin-top:8px;}
.btn-row{display:flex; gap:8px;}
.btn-row .btn{margin-top:0;}

.cal-title-preview{background:var(--bg); border-radius:12px; padding:12px 13px; font-size:.92rem; font-weight:700; box-shadow:var(--shadow-in); word-break:break-word; margin-bottom:2px;}
.hint{font-size:.72rem; color:var(--text3); margin-top:9px; line-height:1.45;}

/* bottom nav */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto;
  background:rgba(246,248,250,.9); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line); display:flex; justify-content:space-around;
  padding:9px 0 calc(9px + var(--safe-b)); z-index:60;
}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text3); font-size:.65rem; font-weight:700; padding:4px 22px;}
.nav-item .icon{stroke:var(--text3);}
.nav-item.active{color:var(--accent);}
.nav-item.active .icon{stroke:var(--accent);}

/* calendar view */
.date-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.round-btn{width:38px; height:38px; border-radius:50%; background:var(--card); box-shadow:var(--shadow-out-sm); display:flex; align-items:center; justify-content:center;}
.date-nav .current{font-weight:800; font-size:1rem; text-align:center;}
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.dow{color:var(--text3); font-size:.68rem; text-align:center; padding:5px 0; font-weight:700;}
.day-cell{aspect-ratio:1; border-radius:11px; padding:6px 5px; background:var(--card); box-shadow:var(--shadow-out-sm); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;}
.day-cell.muted{opacity:0; pointer-events:none; box-shadow:none; background:transparent;}
.day-cell.today{box-shadow: inset 0 0 0 2px var(--accent), var(--shadow-out-sm);}
.day-cell .dn{font-size:.85rem; font-weight:700;}
.day-cell .dd{display:flex; gap:2px; flex-wrap:wrap; justify-content:center;}
.day-cell .dd span{width:5px; height:5px; border-radius:50%;}

.booking-item{background:var(--card); border-radius:14px; box-shadow:var(--shadow-out-sm); padding:13px 14px; margin-bottom:9px; display:flex; gap:12px; align-items:flex-start; border-left:4px solid var(--accent);}
.booking-item .time{font-size:.78rem; font-weight:800; color:var(--text2); min-width:50px; line-height:1.35;}
.booking-item .info{flex:1; min-width:0;}
.booking-item .title{font-weight:700; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.booking-item .meta{font-size:.73rem; color:var(--text3); margin-top:2px;}
.booking-item .flags{display:flex; gap:5px; margin-top:6px;}
.booking-item .flags .icon{width:14px; height:14px; opacity:.25;}
.booking-item .flags .icon.on{opacity:1; stroke:var(--ok);}
.empty-state{text-align:center; padding:44px 20px; color:var(--text3); font-size:.88rem; line-height:1.6;}

/* settings */
.settings-group{margin-bottom:20px;}
.settings-group h3{font-size:.72rem; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.08em; margin-bottom:9px; padding-left:3px;}
.settings-row{background:var(--card); border-radius:var(--radius-sm); box-shadow:var(--shadow-out); overflow:hidden;}
.settings-item{display:flex; align-items:center; justify-content:space-between; padding:13px 15px; border-bottom:1px solid var(--line); gap:12px;}
.settings-item:last-child{border-bottom:none;}
.settings-item .label{font-size:.9rem; font-weight:600;}
.settings-item .label small{display:block; font-size:.72rem; color:var(--text3); font-weight:500; margin-top:1px;}
.settings-item input{background:transparent; text-align:right; font-size:.88rem; color:var(--accent); width:150px;}
.settings-item .chev{stroke:var(--text3); width:16px; height:16px; flex:0 0 auto;}
.color-dot{width:15px; height:15px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle;}
.hall-row-btn{width:100%; text-align:left;}

/* sheet / overlay */
.overlay{position:fixed; inset:0; background:rgba(20,22,30,.32); backdrop-filter:blur(3px); z-index:100; display:none; align-items:flex-end; justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:var(--bg); border-radius:26px 26px 0 0; width:100%; max-width:520px; max-height:90dvh; overflow-y:auto; padding:12px 18px calc(26px + var(--safe-b)); animation:slideUp .28s cubic-bezier(.2,.9,.3,1);}
@keyframes slideUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
.sheet-handle{width:36px; height:5px; background:rgba(0,0,0,.15); border-radius:3px; margin:0 auto 16px;}
.sheet h2{font-size:1.15rem; font-weight:800; margin-bottom:14px; letter-spacing:-.01em;}
.sheet-close{position:absolute; top:14px; right:16px; width:32px; height:32px; border-radius:50%; background:var(--card); box-shadow:var(--shadow-out-sm); display:flex; align-items:center; justify-content:center;}

.color-picker{display:flex; gap:9px; flex-wrap:wrap; margin-top:2px;}
.color-swatch{width:32px; height:32px; border-radius:50%; box-shadow:var(--shadow-out-sm); position:relative;}
.color-swatch.active::after{content:""; position:absolute; inset:-4px; border-radius:50%; border:2px solid var(--text);}

.tier-row{display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-top:8px;}
.tier-row:first-of-type{margin-top:2px;}
.icon-btn-sm{width:36px; height:36px; border-radius:10px; background:var(--card); box-shadow:var(--shadow-out-sm); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}

.toast{position:fixed; bottom:calc(84px + var(--safe-b)); left:50%; transform:translateX(-50%) translateY(80px); background:rgba(28,28,30,.94); color:#fff; padding:12px 20px; border-radius:30px; font-weight:600; font-size:.86rem; z-index:200; transition:transform .3s cubic-bezier(.2,.9,.3,1); box-shadow:0 8px 28px rgba(0,0,0,.25); pointer-events:none; max-width:86vw; text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}

.field-error{box-shadow: inset 3px 3px 8px rgba(255,59,48,.28), inset -3px -3px 7px rgba(255,255,255,.85) !important;}
.subnote{font-size:.72rem; color:var(--text3); margin-top:6px; line-height:1.45;}
.info-box{background:var(--card-2); border-radius:var(--radius-sm); padding:13px 14px; font-size:.8rem; line-height:1.55; color:var(--text2); box-shadow:var(--shadow-in);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1 id="topTitle">Томсон</h1>
    <div class="sub" id="topSub">Бронирование</div>
  </div>

  <div class="content">

    <!-- ============ BOOKING VIEW ============ -->
    <div class="view active" id="view-booking">
      <div class="chips" id="hallChips"></div>

      <div class="conflict" id="conflictBanner">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <span id="conflictText"></span>
      </div>

      <div class="card">
        <div class="card-title">Клиент</div>
        <label>Имя</label>
        <input class="field" type="text" id="fName" placeholder="Анна">
        <label>Телефон</label>
        <input class="field" type="tel" id="fPhone" placeholder="+7 923 000-00-00">
        <label>Гостей</label>
        <input class="field" type="number" id="fGuests" min="1" max="60" placeholder="5">
        <div class="row2">
          <div><label>Дата</label><input class="field" type="date" id="fDate"></div>
          <div><label>С</label><input class="field" type="time" id="fStart"></div>
        </div>
        <label>До</label>
        <input class="field" type="time" id="fEnd">
        <div class="price-hint" id="priceHint"></div>
      </div>

      <div class="card">
        <div class="card-title">Статус оплаты и теги</div>
        <div class="status-row" id="payRow">
          <button class="status-btn" data-pay="none">- ждём</button>
          <button class="status-btn" data-pay="half">. 50%</button>
          <button class="status-btn" data-pay="full">.. 100%</button>
        </div>
        <label>Теги</label>
        <div class="tags" id="tagGrid"></div>
      </div>

      <div class="card">
        <div class="seg" id="msgSeg">
          <button class="active" data-mtab="1">Сообщение</button>
          <button data-mtab="2">Подтверждение</button>
        </div>
        <div style="margin-top:13px;">
          <div class="preview" id="msgPreview" contenteditable="true" spellcheck="false"></div>
          <button class="btn btn-wa" id="btnWa"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.3A9 9 0 1 0 12 3Z"/><path d="M8.5 8.6c.2-.5.5-.5.8-.5h.6c.2 0 .4 0 .6.4.2.5.7 1.6.7 1.7.1.1.1.3 0 .4-.1.2-.1.3-.3.4-.1.2-.3.3-.4.5-.1.1-.3.3-.1.5.2.4.8 1.2 1.6 2 1.1.9 2 1.2 2.3 1.4.3.1.5.1.6-.1.2-.2.7-.8.9-1 .2-.2.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.4.2.5.3 0 .2 0 .9-.3 1.4-.4.6-1.6 1.2-2.2 1.2-.6 0-1.9-.2-3.7-1.5-2.1-1.6-3.5-3.8-3.6-4Z"/></svg>WhatsApp</button>
          <button class="btn btn-tg" id="btnTg"><svg class="icon" viewBox="0 0 24 24"><path d="m21 4-3 16.5-6-4.2-3 2.7v-4.2L18.5 6 6 12.3 2 11Z"/></svg>Telegram</button>
          <button class="btn btn-max" id="btnMax"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 8.5 12 12l4-3.5V16h-2v-4l-2 1.6L10 12v4H8Z"/></svg>MAX</button>
          <button class="btn btn-ghost" id="btnCopy"><svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Скопировать</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Календарь</div>
        <div class="cal-title-preview" id="calTitlePreview">—</div>
        <button class="btn btn-blue" id="btnGCal"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4"/></svg>Добавить в Google Календарь</button>
        <button class="btn btn-dark" id="btnSaveBooking"><svg class="icon" viewBox="0 0 24 24"><path d="M5 5a2 2 0 0 1 2-2h9l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/><path d="M8 3v5h8V3M8 21v-7h8v7"/></svg>Сохранить бронь</button>
        <div class="hint" id="calHint">Откроется черновик события в приложении Google Календарь — останется нажать «Сохранить».</div>
      </div>
    </div>

    <!-- ============ CALENDAR VIEW ============ -->
    <div class="view" id="view-calendar">
      <div class="seg" id="calSeg" style="margin-bottom:14px;">
        <button class="active" data-csub="day">День</button>
        <button data-csub="month">Месяц</button>
      </div>
      <div class="chips" id="calHallChips"></div>

      <div id="calDayBlock">
        <div class="date-nav">
          <button class="round-btn" id="dayPrev"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="m15 6-6 6 6 6"/></svg></button>
          <div class="current" id="calDayLabel">Сегодня</div>
          <button class="round-btn" id="dayNext"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
        <div id="bookingsList"></div>
      </div>

      <div id="calMonthBlock" style="display:none;">
        <div class="date-nav">
          <button class="round-btn" id="monthPrev"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="m15 6-6 6 6 6"/></svg></button>
          <div class="current" id="calMonthLabel">Месяц</div>
          <button class="round-btn" id="monthNext"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </div>

      <button class="btn btn-ghost" id="btnOpenGoogleDay" style="margin-top:16px;"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Открыть этот день в Google Календаре</button>
    </div>

    <!-- ============ SETTINGS VIEW ============ -->
    <div class="view" id="view-settings">
      <div class="seg" id="setSeg" style="margin-bottom:16px;">
        <button class="active" data-stab="studio">Студия</button>
        <button data-stab="halls">Залы</button>
        <button data-stab="google">Google</button>
        <button data-stab="data">Данные</button>
      </div>
      <div id="settingsContent"></div>
    </div>

  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="booking">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Бронь
    </button>
    <button class="nav-item" data-view="calendar">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь
    </button>
    <button class="nav-item" data-view="settings">

/* ===================== СОСТОЯНИЕ / ХРАНИЛИЩЕ ===================== */
const CFG_KEY = 'tomson_cfg_v1';
const BOOK_KEY = 'tomson_bookings_v3';

let bookings = loadBookings();

let view = 'booking';
let activeHallId = cfg.halls[0]?.id || null;
let currentPay = 'none';
let currentTags = new Set();
let msgTab = '1';
let editingId = null; // id брони, которая сейчас редактируется в форме (для upsert)

let calSub = 'day';
let calCursor = new Date();
let calFilterHall = 'all';
let monthCursor = new Date();

function loadCfg(){
  try{
    const raw = JSON.parse(localStorage.getItem(CFG_KEY));
    if(raw && raw.halls && raw.halls.length) return raw;
  }catch(e){}
  const d = defaultCfg(); localStorage.setItem(CFG_KEY, JSON.stringify(d)); return d;
}
function saveCfg(){ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }
function loadBookings(){
  try{ return JSON.parse(localStorage.getItem(BOOK_KEY) || '[]'); }catch(e){ return []; }
}
function saveBookingsAll(){ localStorage.setItem(BOOK_KEY, JSON.stringify(bookings.slice(0,500))); }

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hallById(id){ return cfg.halls.find(h=>h.id===id); }

/* ===================== УТИЛИТЫ ФОРМАТА ===================== */
function fmtDate(iso){ if(!iso) return '__.__.____'; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y}`; }
function toMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function durationHours(s,e){ if(!s||!e) return null; let mins=toMinutes(e)-toMinutes(s); if(mins<=0) mins+=24*60; return mins/60; }
function money(n){ return new Intl.NumberFormat('ru-RU').format(Math.round(n)); }
function priceForGuests(hall,g){ const t = hall.tiers.find(x=>g<=x.max) || hall.tiers[hall.tiers.length-1]; return t? t.price : 0; }
function normalizePhone(raw){
  let d=(raw||'').replace(/\D/g,'');
  if(d.length===11 && d[0]==='8') d='7'+d.slice(1);
  if(d.length===10) d='7'+d;
  return d;
}
function esc(s){ return String(s??''); }

/* ===================== ШАБЛОНИЗАТОР СООБЩЕНИЙ ===================== */
function interpolate(tpl, ctx){
  return tpl.replace(/\{\{(\w+)\}\}/g, (m,k)=> (ctx[k]!==undefined && ctx[k]!==null) ? ctx[k] : '');
}
function currentCtx(hall){
  return {
    имя: $('#fName').value.trim(),
    телефон: $('#fPhone').value.trim(),
    зал: hall.name, офис: hall.office,
    дата: fmtDate($('#fDate').value),
    начало: $('#fStart').value || '__:__',
    конец: $('#fEnd').value || '__:__',
    гостей: $('#fGuests').value || '',
    цены: hall.pricesText, реквизиты: hall.cardsText,
    адрес: cfg.studio.address, этаж: cfg.studio.floor,
    правила: cfg.studio.rulesUrl, как_найти: cfg.studio.findUrl,
  };
}
function buildMessage(which){
  const hall = hallById(activeHallId); if(!hall) return '';
  const tpl = which==='1' ? hall.msg1 : hall.msg2;
  return interpolate(tpl, currentCtx(hall));
}
function buildCalendarTitle(){
  const emojiPrefix = TAGS.map((t,i)=> currentTags.has(String(i)) ? t.e : null).filter(Boolean).join('');
  const prefix = emojiPrefix + PAY_SYMBOL[currentPay];
  const name = $('#fName').value.trim();
  const phone = $('#fPhone').value.trim();
  return [prefix, name, phone].filter(Boolean).join(' ');
}

/* ===================== HALL CHIPS (переиспользуемо) ===================== */
function renderHallChips(container, activeId, onClick){
  container.innerHTML = cfg.halls.map(h=>`
    <button class="chip ${h.id===activeId?'active':''}" data-hid="${h.id}">
      <span class="cn"><span class="dot" style="background:${h.color}"></span>${h.name}</span>
      <span class="co">оф. ${h.office}</span>
    </button>`).join('');
  container.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=> onClick(btn.dataset.hid));
  });
}

/* ===================== BOOKING VIEW ===================== */
function renderBookingHalls(){
  renderHallChips($('#hallChips'), activeHallId, (id)=>{ activeHallId=id; renderBooking(); });
}
function buildTagGrid(){
  const wrap = $('#tagGrid');
  wrap.innerHTML = TAGS.map((t,i)=>`<button type="button" class="tag" data-tag="${i}" title="${t.l}">${t.e}</button>`).join('');
  wrap.querySelectorAll('.tag').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = btn.dataset.tag;
      if(currentTags.has(i)) currentTags.delete(i); else currentTags.add(i);
      btn.classList.toggle('active');
      renderCalendarTitlePreview();
    });
  });
}
$('#payRow').addEventListener('click', e=>{
  const btn = e.target.closest('.status-btn'); if(!btn) return;
  currentPay = btn.dataset.pay;
  $$('.status-btn').forEach(b=> b.classList.toggle('active', b===btn));
  renderCalendarTitlePreview();
});
$('#msgSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  msgTab = btn.dataset.mtab;
  $$('#msgSeg button').forEach(b=> b.classList.toggle('active', b===btn));
  renderMessagePreview();
});
['fName','fPhone','fGuests','fDate','fStart','fEnd'].forEach(id=>{
  $('#'+id).addEventListener('input', ()=>{ renderBooking(); });
});

function toMinutesSafe(t){ return toMinutes(t); }
function checkConflict(){
  const banner = $('#conflictBanner');
  const date = $('#fDate').value, s = $('#fStart').value, e = $('#fEnd').value;
  if(!activeHallId || !date || !s || !e){ banner.classList.remove('show'); return; }
  const sM = toMinutes(s); let eM = toMinutes(e); if(eM<=sM) eM+=24*60;
  const clash = bookings.find(b=>{
    if(b.id===editingId) return false;
    if(b.hallId!==activeHallId || b.date!==date || !b.start || !b.end) return false;
    let bs=toMinutes(b.start), be=toMinutes(b.end); if(be<=bs) be+=24*60;
    return sM<be && bs<eM;
  });
  if(clash){
    const hall = hallById(activeHallId);
    $('#conflictText').innerHTML = `Пересекается с бронью <b>${clash.name||'без имени'}</b> ${clash.start}–${clash.end} в зале «${hall.name}»`;
    banner.classList.add('show');
  } else banner.classList.remove('show');
}
function renderPriceHint(){
  const hall = hallById(activeHallId); if(!hall){ $('#priceHint').textContent=''; return; }
  const g = parseInt($('#fGuests').value,10);
  let text = `Цены «${hall.name}»:\n${hall.pricesText}`;
  if(g>0){
    const rate = priceForGuests(hall,g);
    const hrs = durationHours($('#fStart').value, $('#fEnd').value);
    text += `\n\n→ ставка: ${money(rate)}₽/час`;
    if(hrs) text += ` · ${hrs%1===0?hrs:hrs.toFixed(1)} ч · итого ≈ ${money(rate*hrs)}₽`;
  }
  $('#priceHint').textContent = text;
}
function renderMessagePreview(){
  if(!activeHallId){ $('#msgPreview').textContent='Выберите зал.'; return; }
  $('#msgPreview').textContent = buildMessage(msgTab);
}
function renderCalendarTitlePreview(){
  $('#calTitlePreview').textContent = buildCalendarTitle() || '—';
}
function renderBooking(){
  renderBookingHalls();
  checkConflict();
  renderPriceHint();
  renderMessagePreview();
  renderCalendarTitlePreview();
  const hall = hallById(activeHallId);
  $('#calHint').textContent = hall && hall.calendarId
    ? `Событие предложат сохранить в календарь «${hall.name}». Останется нажать «Сохранить».`
    : `Календарь для зала «${hall?hall.name:''}» не привязан — событие откроется в календаре по умолчанию. Привязать можно в Настройках → Залы.`;
}

function showToast(text){
  const t=$('#toast'); t.textContent=text; t.classList.add('show');

function clearFieldErrors(){ ['fDate','fStart','fEnd','fName'].forEach(id=> $('#'+id).classList.remove('field-error')); }
function validateCore(){
  clearFieldErrors();
  if(!activeHallId){ showToast('Сначала выберите зал'); return false; }
  let ok = true;
  ['fDate','fStart','fEnd'].forEach(id=>{ if(!$('#'+id).value){ $('#'+id).classList.add('field-error'); ok=false; } });
  if(!ok) showToast('Заполните дату и время брони');
  return ok;
}

/* ===================== КОПИРОВАНИЕ / ОТПРАВКА ===================== */
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} document.body.removeChild(ta);
  }
}
function getPreviewText(){ return $('#msgPreview').innerText || $('#msgPreview').textContent; }

$('#btnCopy').addEventListener('click', async ()=>{
  if(!validateCore()) return;
  await copyText(getPreviewText());
  showToast('Текст скопирован');
  markFlag(msgTab==='1'?'msg1Sent':'msg2Sent');
});
$('#btnWa').addEventListener('click', ()=>{

  if(digits.length<10){ $('#fPhone').classList.add('field-error'); showToast('Укажите телефон клиента'); return; }

$('#btnTg').addEventListener('click', ()=>{

  window.open(`https://t.me/share/url?url=&text=${encodeURIComponent(getPreviewText())}`, '_blank');

});
$('#btnMax').addEventListener('click', ()=>{
  if(!validateCore()) return;
  window.open(`https://max.ru/:share?text=${encodeURIComponent(getPreviewText())}`, '_blank');

function afterSend(){
  if(msgTab==='2' && currentPay!=='full'){
    currentPay='full';
    $$('.status-btn').forEach(b=> b.classList.toggle('active', b.dataset.pay==='full'));
    renderCalendarTitlePreview();
    showToast('Статус оплаты обновлён на 100% — не забудьте обновить событие в календаре');
  }
  markFlag(msgTab==='1'?'msg1Sent':'msg2Sent');
}

/* ===================== GOOGLE КАЛЕНДАРЬ ===================== */
function toGCalDate(iso,hm){ return iso.replace(/-/g,'')+'T'+hm.replace(':','')+'00'; }
function gcalUrl(hall, title, startISO, s, endISO, e, details){
  let url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title)
    + '&dates=' + toGCalDate(startISO,s) + '/' + toGCalDate(endISO,e)
    + '&details=' + encodeURIComponent(details)
    + '&location=' + encodeURIComponent(`${cfg.studio.address}, ${cfg.studio.floor}, оф. ${hall.office}`);
  if(hall.calendarId) url += '&src=' + encodeURIComponent(hall.calendarId);
  return url;
}
$('#btnGCal').addEventListener('click', ()=>{
  if(!validateCore()) return;
  if(!$('#fName').value.trim()){ $('#fName').classList.add('field-error'); showToast('Укажите имя клиента'); return; }
  const hall = hallById(activeHallId);
  const title = buildCalendarTitle();
  const startISO = $('#fDate').value; let endISO = startISO;
  if(toMinutes($('#fEnd').value) <= toMinutes($('#fStart').value)){
    const d=new Date(startISO); d.setDate(d.getDate()+1); endISO=d.toISOString().slice(0,10);
  }
  const guests = $('#fGuests').value ? `${$('#fGuests').value} гостей` : 'не указано';
  const rate = $('#fGuests').value ? priceForGuests(hall, parseInt($('#fGuests').value,10)) : null;
  const details = [
    `Зал: ${hall.name} (оф. ${hall.office})`,
    `Гостей: ${guests}`,
    $('#fPhone').value.trim() ? `Телефон: ${$('#fPhone').value.trim()}` : null,
    `Оплата: ${PAY_LABEL[currentPay]}`,
    rate ? `Ставка: ${money(rate)}₽/час` : null,
  ].filter(Boolean).join('\n');
  window.open(gcalUrl(hall, title, startISO, $('#fStart').value, endISO, $('#fEnd').value, details), '_blank');
  markFlag('calendarAdded');
  showToast('Открываю Google Календарь…');
});

/* ===================== СОХРАНЕНИЕ БРОНИ ===================== */
function currentFormBooking(prev){
  return {
    id: (prev&&prev.id) || uid(),
    hallId: activeHallId,
    name: $('#fName').value.trim(),
    phone: $('#fPhone').value.trim(),
    guests: $('#fGuests').value,
    date: $('#fDate').value,
    start: $('#fStart').value,
    end: $('#fEnd').value,
    payment: currentPay,
    tags: Array.from(currentTags),
    notes: (prev && prev.notes) || '',
    msg1Sent:(prev&&prev.msg1Sent)||false,
    msg2Sent:(prev&&prev.msg2Sent)||false,
    calendarAdded:(prev&&prev.calendarAdded)||false,
    savedAt: new Date().toISOString(),
  };
}
function markFlag(flag){
  if(!activeHallId || !$('#fDate').value) return;
  let idx = editingId ? bookings.findIndex(b=>b.id===editingId) : -1;
  if(idx<0) idx = bookings.findIndex(b=> b.hallId===activeHallId && b.date===$('#fDate').value && b.start===$('#fStart').value && b.end===$('#fEnd').value);
  const prev = idx>=0 ? bookings[idx] : null;
  const b = currentFormBooking(prev); b[flag]=true;
  if(idx>=0) bookings[idx]=b; else bookings.unshift(b);
  editingId = b.id; saveBookingsAll();
}
$('#btnSaveBooking').addEventListener('click', ()=>{
  if(!validateCore()) return;
  if(!$('#fName').value.trim()){ $('#fName').classList.add('field-error'); showToast('Укажите имя клиента'); return; }
  let idx = editingId ? bookings.findIndex(b=>b.id===editingId) : -1;
  const prev = idx>=0 ? bookings[idx] : null;
  const b = currentFormBooking(prev);
  if(idx>=0) bookings[idx]=b; else bookings.unshift(b);
  editingId = b.id; saveBookingsAll();
  showToast('Бронь сохранена');
});

function loadBookingIntoForm(b){
  editingId = b.id;
  activeHallId = b.hallId;
  $('#fName').value=b.name||''; $('#fPhone').value=b.phone||'';
  $('#fGuests').value=b.guests||''; $('#fDate').value=b.date||'';
  $('#fStart').value=b.start||''; $('#fEnd').value=b.end||'';
  currentPay = b.payment || 'none';
  currentTags = new Set(b.tags||[]);
  $$('.status-btn').forEach(bt=> bt.classList.toggle('active', bt.dataset.pay===currentPay));
  $$('.tag').forEach(bt=> bt.classList.toggle('active', currentTags.has(bt.dataset.tag)));
  renderBooking();
  showView('booking');
  window.scrollTo({top:0,behavior:'smooth'});
}
function newBookingForm(){
  editingId = null;
  $('#fName').value=''; $('#fPhone').value=''; $('#fGuests').value='';
  currentPay='none'; currentTags=new Set();
  $$('.status-btn').forEach(bt=> bt.classList.toggle('active', bt.dataset.pay==='none'));
  $$('.tag').forEach(bt=> bt.classList.remove('active'));
}

/* ===================== CALENDAR VIEW ===================== */
function isoOf(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
const WEEKDAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

function renderCalHallChips(){
  const wrap = $('#calHallChips');
  const all = [{id:'all', name:'Все', office:'', color:'#8E8E93'}, ...cfg.halls];
  wrap.innerHTML = all.map(h=>`
    <button class="chip ${h.id===calFilterHall?'active':''}" data-hid="${h.id}">
      <span class="cn"><span class="dot" style="background:${h.color}"></span>${h.name}</span>
    </button>`).join('');
  wrap.querySelectorAll('.chip').forEach(btn=> btn.addEventListener('click', ()=>{ calFilterHall=btn.dataset.hid; renderCalendar(); }));
}
$('#calSeg').addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  calSub = btn.dataset.csub;
  $$('#calSeg button').forEach(b=> b.classList.toggle('active', b===btn));
  $('#calDayBlock').style.display = calSub==='day' ? '' : 'none';
  $('#calMonthBlock').style.display = calSub==='month' ? '' : 'none';
  renderCalendar();
});
$('#dayPrev').addEventListener('click', ()=>{ calCursor.setDate(calCursor.getDate()-1); renderCalendar(); });
$('#dayNext').addEventListener('click', ()=>{ calCursor.setDate(calCursor.getDate()+1); renderCalendar(); });
$('#monthPrev').addEventListener('click', ()=>{ monthCursor.setMonth(monthCursor.getMonth()-1); renderCalendar(); });
$('#monthNext').addEventListener('click', ()=>{ monthCursor.setMonth(monthCursor.getMonth()+1); renderCalendar(); });
$('#btnOpenGoogleDay').addEventListener('click', ()=>{
  const d = calCursor;
  window.open(`https://calendar.google.com/calendar/u/0/r/day/${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`, '_blank');
});

function renderDayList(){
  const dayStr = isoOf(calCursor);
  const isToday = isoOf(new Date())===dayStr;
  $('#calDayLabel').textContent = isToday ? 'Сегодня' : `${WEEKDAYS[(calCursor.getDay()+6)%7]}, ${calCursor.getDate()} ${MONTHS[calCursor.getMonth()]}`;
  let items = bookings.filter(b=>b.date===dayStr);
  if(calFilterHall!=='all') items = items.filter(b=>b.hallId===calFilterHall);
  items.sort((a,b)=> (a.start||'').localeCompare(b.start||''));
  const box = $('#bookingsList');
  if(!items.length){ box.innerHTML = `<div class="empty-state">Нет броней на этот день.<br>Сохраняйте карточку кнопкой «Сохранить бронь».</div>`; return; }
  box.innerHTML = items.map(b=>{
    const hall = hallById(b.hallId) || {name:b.hallId,color:'#8E8E93',office:''};
    const tags = (b.tags||[]).map(i=> TAGS[i]?TAGS[i].e:'').join('');
    const title = `${tags}${PAY_SYMBOL[b.payment]||''} ${b.name||'Без имени'} ${b.phone||''}`.trim();
    return `<div class="booking-item" style="border-left-color:${hall.color}" data-id="${b.id}">
      <div class="time">${b.start||'--:--'}<br>–${b.end||'--:--'}</div>
      <div class="info">
        <div class="title">${title}</div>
        <div class="meta">${hall.name} · ${b.guests||'?'} чел.${b.notes? ' · '+b.notes:''}</div>
        <div class="flags">
          <span class="icon ${b.msg1Sent?'on':''}">${ICO.msg}</span>
          <span class="icon ${b.msg2Sent?'on':''}">${ICO.check}</span>
          <span class="icon ${b.calendarAdded?'on':''}">${ICO.cal}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.booking-item').forEach(el=> el.addEventListener('click', ()=> openBookingDetail(el.dataset.id)));
}
function renderMonth(){
  $('#calMonthLabel').textContent = `${MONTHS[monthCursor.getMonth()][0].toUpperCase()+MONTHS[monthCursor.getMonth()].slice(1)} ${monthCursor.getFullYear()}`;
  const y=monthCursor.getFullYear(), m=monthCursor.getMonth();
  const first = new Date(y,m,1); const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayISO = isoOf(new Date());
  let html = WEEKDAYS.map(w=>`<div class="dow">${w}</div>`).join('');
  for(let i=0;i<startOffset;i++) html += `<div class="day-cell muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(y,m,d); const key = isoOf(date);
    let items = bookings.filter(b=>b.date===key);
    if(calFilterHall!=='all') items = items.filter(b=>b.hallId===calFilterHall);
    const dots = items.slice(0,6).map(b=>{ const h=hallById(b.hallId); return `<span style="background:${h?h.color:'#8E8E93'}"></span>`; }).join('');
    html += `<div class="day-cell ${key===todayISO?'today':''}" data-date="${key}"><span class="dn">${d}</span><span class="dd">${dots}</span></div>`;
  }
  $('#monthGrid').innerHTML = html;
  $('#monthGrid').querySelectorAll('.day-cell[data-date]').forEach(el=>{
    el.addEventListener('click', ()=>{
      calCursor = new Date(el.dataset.date+'T00:00:00');
      calSub='day';
      $$('#calSeg button').forEach(b=> b.classList.toggle('active', b.dataset.csub==='day'));
      $('#calDayBlock').style.display=''; $('#calMonthBlock').style.display='none';
      renderCalendar();
    });
  });
}
function renderCalendar(){
  renderCalHallChips();
  if(calSub==='day') renderDayList(); else renderMonth();
}

function openBookingDetail(id){
  const b = bookings.find(x=>x.id===id); if(!b) return;
  const hall = hallById(b.hallId) || {name:b.hallId, office:''};
  const tags = (b.tags||[]).map(i=> TAGS[i]?TAGS[i].e+' '+TAGS[i].l:'').filter(Boolean);
  openSheet(`
    <button class="sheet-close" onclick="closeSheet()">${ICO.close}</button>
    <h2>${esc(b.name)||'Без имени'}</h2>
    <div class="info-box">
      <div><b>${PAY_SYMBOL[b.payment]||''} ${esc(b.name)} ${esc(b.phone)}</b></div>
      <div style="margin-top:6px;">${hall.name} · оф. ${hall.office}</div>
      <div>${fmtDate(b.date)} · ${b.start}–${b.end}</div>
      <div>Гостей: ${b.guests||'—'}</div>
      ${tags.length? `<div style="margin-top:6px;">${tags.join('<br>')}</div>`:''}
      ${b.notes? `<div style="margin-top:6px;">Заметки: ${esc(b.notes)}</div>`:''}
    </div>
    <button class="btn btn-blue" onclick="loadBookingIntoForm(bookings.find(x=>x.id==='${b.id}')); closeSheet();">Открыть в карточке брони</button>
    <button class="btn btn-danger" onclick="confirmDeleteBooking('${b.id}')">${ICO.trash}Удалить бронь</button>
  `);
}
function confirmDeleteBooking(id){
  openConfirmSheet('Удалить эту бронь из истории приложения? Событие в Google Календаре (если было создано) нужно будет удалить отдельно.', ()=>{
    bookings = bookings.filter(x=>x.id!==id); saveBookingsAll(); closeSheet(); renderCalendar(); showToast('Бронь удалена');
  });
}

function showView(name){

  $$('.view').forEach(v=> v.classList.remove('active'));
  $('#view-'+name).classList.add('active');
  $$('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.view===name));

  $('#topSub').textContent = titles[name][1];

  if(name==='settings') renderSettings();

}

    });
    $('#btnResetAll').addEventListener('click', ()=>{
      openConfirmSheet('Все настройки, залы и сохранённые брони будут удалены безвозвратно. Продолжить?', ()=>{
        localStorage.removeItem(CFG_KEY); localStorage.removeItem(BOOK_KEY);
        cfg = loadCfg(); bookings = loadBookings(); activeHallId = cfg.halls[0]?.id||null;
        closeSheet(); showToast('Сброшено'); renderSettings(); renderBooking();
      });
    });
  }
}

function openHallEditor(hallId){
  const h = hallById(hallId); if(!h) return;
  const tiersHtml = h.tiers.map((t,i)=>`
    <div class="tier-row" data-ti="${i}">
      <input class="field" type="number" value="${t.max}" placeholder="до N чел" data-tf="max">
      <input class="field" type="number" value="${t.price}" placeholder="цена ₽/час" data-tf="price">
      <button class="icon-btn-sm" data-tdel="${i}">${ICO.close}</button>
    </div>`).join('');
  openSheet(`
    <button class="sheet-close" onclick="closeSheet()">${ICO.close}</button>
    <h2>${esc(h.name)}</h2>
    <label>Название зала</label><input class="field" id="h_name" value="${esc(h.name)}">
    <label>Офис</label><input class="field" id="h_office" value="${esc(h.office)}">
    <label>Цвет</label>
    <div class="color-picker" id="h_colors">
      ${HALL_COLORS.map(c=>`<button type="button" class="color-swatch ${c===h.color?'active':''}" style="background:${c}" data-color="${c}"></button>`).join('')}
    </div>
    <label>Google Calendar ID (необязательно)</label>
    <input class="field" id="h_calid" value="${esc(h.calendarId)}" placeholder="xxxxxxxx@group.calendar.google.com">
    <label>Тарифы (для расчёта стоимости)</label>
    <div id="h_tiers">${tiersHtml}</div>
    <button class="btn btn-ghost btn-sm" id="h_addTier">${ICO.plus}Добавить тариф</button>
    <label>Текст цен для сообщения ({{цены}})</label>
    <textarea class="field" id="h_pricesText" rows="4">${esc(h.pricesText)}</textarea>
    <label>Реквизиты для сообщения ({{реквизиты}})</label>
    <textarea class="field" id="h_cardsText" rows="5">${esc(h.cardsText)}</textarea>
    <label>Шаблон сообщения до оплаты</label>
    <textarea class="field" id="h_msg1" rows="10">${esc(h.msg1)}</textarea>
    <label>Шаблон сообщения-подтверждения</label>
    <textarea class="field" id="h_msg2" rows="8">${esc(h.msg2)}</textarea>
    <p class="subnote">Переменные: {{имя}} {{телефон}} {{зал}} {{офис}} {{дата}} {{начало}} {{конец}} {{гостей}} {{цены}} {{реквизиты}} {{адрес}} {{этаж}} {{правила}} {{как_найти}}</p>
    <button class="btn btn-dark" id="h_save">Сохранить зал</button>
    ${cfg.halls.length>1 ? `<button class="btn btn-danger" id="h_delete">${ICO.trash}Удалить зал</button>` : ''}
  `);
  let selectedColor = h.color;
  $('#h_colors').querySelectorAll('.color-swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{ selectedColor=sw.dataset.color; $$('#h_colors .color-swatch').forEach(x=>x.classList.toggle('active', x===sw)); });
  });
  $('#h_addTier').addEventListener('click', ()=>{
    const wrap = $('#h_tiers'); const div = document.createElement('div');
    div.className='tier-row'; div.innerHTML = `<input class="field" type="number" placeholder="до N чел" data-tf="max"><input class="field" type="number" placeholder="цена ₽/час" data-tf="price"><button class="icon-btn-sm" data-tdel="new">${ICO.close}</button>`;
    wrap.appendChild(div);
    div.querySelector('[data-tdel]').addEventListener('click', ()=> div.remove());
  });
  $('#h_tiers').querySelectorAll('[data-tdel]').forEach(btn=> btn.addEventListener('click', ()=> btn.closest('.tier-row').remove()));
  $('#h_save').addEventListener('click', ()=>{
    h.name = $('#h_name').value.trim() || h.name;
    h.office = $('#h_office').value.trim();
    h.color = selectedColor;
    h.calendarId = $('#h_calid').value.trim();
    h.pricesText = $('#h_pricesText').value;
    h.cardsText = $('#h_cardsText').value;
    h.msg1 = $('#h_msg1').value;
    h.msg2 = $('#h_msg2').value;
    h.tiers = $$('#h_tiers .tier-row').map(row=>({
      max: parseInt(row.querySelector('[data-tf="max"]').value,10) || 999,
      price: parseInt(row.querySelector('[data-tf="price"]').value,10) || 0,
    })).sort((a,b)=>a.max-b.max);
    saveCfg(); closeSheet(); showToast('Зал сохранён'); renderSettings();
    if(activeHallId===h.id) renderBooking();
  });
  const delBtn = $('#h_delete');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    openConfirmSheet(`Удалить зал «${h.name}»? Сохранённые брони этого зала останутся в истории, но зал исчезнет из списка.`, ()=>{
      cfg.halls = cfg.halls.filter(x=>x.id!==h.id); saveCfg();
      if(activeHallId===h.id) activeHallId = cfg.halls[0]?.id||null;
      closeSheet(); showToast('Зал удалён'); renderSettings(); renderBooking();
    });
  });
}

/* ===================== СТАРТ ===================== */
(function init(){
  buildTagGrid();
  $('#fDate').value = isoOf(new Date());
  $$('.status-btn').forEach(b=> b.classList.toggle('active', b.dataset.pay==='none'));
  renderBooking();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
